<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Đăng nhập</title>

  <link rel="stylesheet" href="style.css">

  <style>
    /* =========================
       QUÊN MẬT KHẨU
    ========================= */

    .forgot-row {
      display: flex;
      justify-content: flex-end;
      margin-top: -3px;
      margin-bottom: 16px;
    }

    .forgot-btn {
      padding: 0;
      border: none;
      background: transparent;
      color: #7c5cfc;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .forgot-btn:hover {
      text-decoration: underline;
      opacity: 0.8;
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 48px !important;
    }

    .show-password-btn {
      position: absolute;
      top: 50%;
      right: 13px;
      transform: translateY(-50%);
      width: 30px;
      height: 30px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: #8a879f;
      font-size: 16px;
      cursor: pointer;
    }

    .show-password-btn:hover {
      background: #f3f0ff;
      color: #7c5cfc;
    }

    /* =========================
       MODAL
    ========================= */

    .forgot-modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 20px;

      background: rgba(21, 19, 40, 0.48);
      backdrop-filter: blur(5px);
    }

    .forgot-modal-overlay.show {
      display: flex;
    }

    .forgot-modal {
      width: 100%;
      max-width: 550px;

      padding: 30px 34px 34px;

      background: #ffffff;
      border: 1px solid #ece9f7;
      border-radius: 24px;

      box-shadow: 0 24px 70px rgba(21, 19, 40, 0.25);

      animation: forgotModalIn 0.25s ease;
    }

    @keyframes forgotModalIn {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .forgot-modal-head {
      display: flex;
      align-items: flex-start;
      gap: 16px;

      margin-bottom: 28px;
    }

    .forgot-modal-icon {
      width: 50px;
      height: 50px;

      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;

      border-radius: 14px;

      background: #f3f0ff;
      color: #7c5cfc;
    }

    .forgot-modal-icon svg {
      width: 24px;
      height: 24px;
    }

    .forgot-modal-title {
      flex: 1;
    }

    .forgot-modal-title h2 {
      margin: 2px 0 5px;

      color: #1b1930;
      font-size: 23px;
      font-weight: 700;
    }

    .forgot-modal-title p {
      margin: 0;

      color: #8a879f;
      font-size: 14px;
      line-height: 1.5;
    }

    .forgot-close-btn {
      width: 38px;
      height: 38px;

      display: flex;
      align-items: center;
      justify-content: center;

      flex-shrink: 0;

      border: none;
      border-radius: 10px;

      background: #f3f0ff;
      color: #7c5cfc;

      font-size: 25px;
      line-height: 1;

      cursor: pointer;
    }

    .forgot-close-btn:hover {
      background: #e9e3ff;
    }

    .forgot-message {
      display: none;

      margin: 0 0 16px;
      padding: 11px 13px;

      border-radius: 10px;

      font-size: 13px;
      line-height: 1.45;
    }

    .forgot-message.error {
      display: block;

      color: #c92a42;
      background: #fbe7ea;
      border: 1px solid #f5c2ca;
    }

    .forgot-message.success {
      display: block;

      color: #23764a;
      background: #e7f6ec;
      border: 1px solid #bde7ca;
    }

    .login-message {
      display: none;

      margin-top: 12px;

      color: #e0475f;
      font-size: 13px;
      text-align: center;
    }

    @media (max-width: 600px) {
      .forgot-modal {
        padding: 24px 20px 26px;
        border-radius: 20px;
      }

      .forgot-modal-title h2 {
        font-size: 20px;
      }

      .forgot-modal-title p {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <div class="bg-decor" aria-hidden="true"></div>

  <!-- =========================
       FORM ĐĂNG NHẬP
  ========================== -->

  <div class="auth-wrap" id="auth-wrap">

    <div class="auth-brand">
      <div class="logo-mark">
        <span class="logo-icon">◆</span>
      </div>

      <p class="auth-brand-name">Đồ án CNPM</p>
      <p class="auth-brand-sub">Công nghệ phần mềm</p>
    </div>

    <section class="auth-card" data-auth="login">

      <div class="auth-head">

        <span class="icon-chip">
          <svg viewBox="0 0 24 24">
            <path d="M6 10V8a6 6 0 0112 0v2"></path>
            <path d="M5 10h14a1 1 0 011 1v9a1 1 0 01-1 1H5a1 1 0 01-1-1v-9a1 1 0 011-1z"></path>
          </svg>
        </span>

        <div>
          <h1>Đăng nhập</h1>
          <p>Chào mừng quay lại WorkSpace</p>
        </div>

      </div>

      <form class="auth-form" id="form-login" novalidate>

        <label class="field">
          <span>Email</span>

          <input
            id="login-email"
            type="text"
            placeholder="name@company.com"
            autocomplete="username"
            required
          >
        </label>

        <label class="field">
          <span>Mật khẩu</span>

          <div class="password-wrap">
            <input
              id="login-password"
              type="password"
              placeholder="Nhập mật khẩu"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="show-password-btn"
              data-toggle-password="login-password"
              aria-label="Hiện hoặc ẩn mật khẩu"
            >
              👁
            </button>
          </div>
        </label>

        <div class="forgot-row">
          <button
            type="button"
            class="forgot-btn"
            id="open-forgot-password"
          >
            Quên mật khẩu?
          </button>
        </div>

        <button
          type="submit"
          class="btn btn-primary btn-block"
          id="login-submit-btn"
        >
          <span class="btn-label">Đăng nhập</span>
          <span class="btn-spinner" aria-hidden="true"></span>
        </button>

        <p class="login-message" id="login-error">
          Sai email hoặc mật khẩu!
        </p>

      </form>

    </section>

  </div>


  <!-- =========================
       MODAL QUÊN MẬT KHẨU
  ========================== -->

  <div
    class="forgot-modal-overlay"
    id="forgot-modal-overlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="forgot-modal-title"
  >

    <div class="forgot-modal">

      <div class="forgot-modal-head">

        <span class="forgot-modal-icon">
          <svg viewBox="0 0 24 24">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"></path>
          </svg>
        </span>

        <div class="forgot-modal-title">
          <h2 id="forgot-modal-title">Quên mật khẩu</h2>

          <p>
            Nhập đúng email tài khoản để tạo mật khẩu mới.
          </p>
        </div>

        <button
          type="button"
          class="forgot-close-btn"
          id="close-forgot-password"
          aria-label="Đóng"
        >
          ×
        </button>

      </div>

      <form id="form-forgot-password" novalidate>

        <p
          class="forgot-message"
          id="forgot-message"
        ></p>

        <label class="field">
          <span>Email</span>

          <input
            id="forgot-email"
            type="text"
            placeholder="Nhập email tài khoản"
            autocomplete="username"
            required
          >
        </label>

        <label class="field">
          <span>Mật khẩu mới</span>

          <div class="password-wrap">
            <input
              id="forgot-new-password"
              type="password"
              placeholder="Tối thiểu 6 ký tự"
              autocomplete="new-password"
              required
            >

            <button
              type="button"
              class="show-password-btn"
              data-toggle-password="forgot-new-password"
              aria-label="Hiện hoặc ẩn mật khẩu mới"
            >
              👁
            </button>
          </div>
        </label>

        <label class="field">
          <span>Xác nhận mật khẩu mới</span>

          <div class="password-wrap">
            <input
              id="forgot-confirm-password"
              type="password"
              placeholder="Nhập lại mật khẩu mới"
              autocomplete="new-password"
              required
            >

            <button
              type="button"
              class="show-password-btn"
              data-toggle-password="forgot-confirm-password"
              aria-label="Hiện hoặc ẩn mật khẩu xác nhận"
            >
              👁
            </button>
          </div>
        </label>

        <button
          type="submit"
          class="btn btn-primary btn-block"
          id="forgot-submit-btn"
        >
          Cập nhật mật khẩu
        </button>

      </form>

    </div>

  </div>


  <script>
    /* =========================
       TÀI KHOẢN MẶC ĐỊNH
    ========================== */

    const DEFAULT_EMAIL = "admin";
    const DEFAULT_PASSWORD = "123456";

    /*
      Khi mở lần đầu:
      Email: admin
      Mật khẩu: 123456
    */

    if (!localStorage.getItem("accountEmail")) {
      localStorage.setItem("accountEmail", DEFAULT_EMAIL);
    }

    if (!localStorage.getItem("accountPassword")) {
      localStorage.setItem("accountPassword", DEFAULT_PASSWORD);
    }


    /* =========================
       LẤY PHẦN TỬ HTML
    ========================== */

    const formLogin =
      document.getElementById("form-login");

    const emailInput =
      document.getElementById("login-email");

    const passwordInput =
      document.getElementById("login-password");

    const loginError =
      document.getElementById("login-error");

    const loginSubmitBtn =
      document.getElementById("login-submit-btn");


    const forgotModalOverlay =
      document.getElementById("forgot-modal-overlay");

    const openForgotButton =
      document.getElementById("open-forgot-password");

    const closeForgotButton =
      document.getElementById("close-forgot-password");

    const formForgotPassword =
      document.getElementById("form-forgot-password");

    const forgotEmailInput =
      document.getElementById("forgot-email");

    const forgotNewPasswordInput =
      document.getElementById("forgot-new-password");

    const forgotConfirmPasswordInput =
      document.getElementById("forgot-confirm-password");

    const forgotMessage =
      document.getElementById("forgot-message");

    const forgotSubmitBtn =
      document.getElementById("forgot-submit-btn");


    /* =========================
       HIỆN THÔNG BÁO
    ========================== */

    function showForgotMessage(message, type) {
      forgotMessage.textContent = message;
      forgotMessage.className = "forgot-message " + type;
    }

    function hideForgotMessage() {
      forgotMessage.textContent = "";
      forgotMessage.className = "forgot-message";
    }


    /* =========================
       MỞ MODAL QUÊN MẬT KHẨU
    ========================== */

    function openForgotModal() {
      hideForgotMessage();

      const currentEmail =
        localStorage.getItem("accountEmail") || DEFAULT_EMAIL;

      forgotEmailInput.value =
        emailInput.value.trim() || currentEmail;

      forgotNewPasswordInput.value = "";
      forgotConfirmPasswordInput.value = "";

      forgotModalOverlay.classList.add("show");

      document.body.style.overflow = "hidden";

      setTimeout(function () {
        forgotEmailInput.focus();
      }, 100);
    }


    /* =========================
       ĐÓNG MODAL
    ========================== */

    function closeForgotModal() {
      forgotModalOverlay.classList.remove("show");

      document.body.style.overflow = "";

      formForgotPassword.reset();

      hideForgotMessage();
    }


    openForgotButton.addEventListener(
      "click",
      openForgotModal
    );

    closeForgotButton.addEventListener(
      "click",
      closeForgotModal
    );


    /*
      Bấm vùng tối bên ngoài modal để đóng.
    */

    forgotModalOverlay.addEventListener(
      "click",
      function (event) {
        if (event.target === forgotModalOverlay) {
          closeForgotModal();
        }
      }
    );


    /*
      Bấm phím Escape để đóng modal.
    */

    document.addEventListener(
      "keydown",
      function (event) {
        if (
          event.key === "Escape" &&
          forgotModalOverlay.classList.contains("show")
        ) {
          closeForgotModal();
        }
      }
    );


    /* =========================
       HIỆN / ẨN MẬT KHẨU
    ========================== */

    document
      .querySelectorAll("[data-toggle-password]")
      .forEach(function (button) {

        button.addEventListener(
          "click",
          function () {

            const inputId =
              button.getAttribute("data-toggle-password");

            const targetInput =
              document.getElementById(inputId);

            if (!targetInput) {
              return;
            }

            if (targetInput.type === "password") {
              targetInput.type = "text";
              button.textContent = "🙈";
            } else {
              targetInput.type = "password";
              button.textContent = "👁";
            }

          }
        );

      });


    /* =========================
       ĐĂNG NHẬP
    ========================== */

    formLogin.addEventListener(
      "submit",
      function (event) {
        event.preventDefault();

        loginError.style.display = "none";

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;

        const savedEmail =
          localStorage.getItem("accountEmail") ||
          DEFAULT_EMAIL;

        const savedPassword =
          localStorage.getItem("accountPassword") ||
          DEFAULT_PASSWORD;

        if (!email || !password) {
          loginError.textContent =
            "Vui lòng nhập đầy đủ email và mật khẩu!";

          loginError.style.display = "block";

          return;
        }

        if (
          email === savedEmail &&
          password === savedPassword
        ) {
          loginSubmitBtn.classList.add("is-loading");

          localStorage.setItem("isLogin", "true");
          localStorage.setItem("userEmail", email);

          setTimeout(function () {
            window.location.href = "index.html";
          }, 500);

        } else {
          loginError.textContent =
            "Sai email hoặc mật khẩu!";

          loginError.style.display = "block";

          passwordInput.focus();
        }
      }
    );


    /* =========================
       CẬP NHẬT MẬT KHẨU MỚI
    ========================== */

    formForgotPassword.addEventListener(
      "submit",
      function (event) {
        event.preventDefault();

        hideForgotMessage();

        const email =
          forgotEmailInput.value.trim();

        const newPassword =
          forgotNewPasswordInput.value;

        const confirmPassword =
          forgotConfirmPasswordInput.value;

        const savedEmail =
          localStorage.getItem("accountEmail") ||
          DEFAULT_EMAIL;


        /*
          Kiểm tra người dùng nhập đầy đủ.
        */

        if (
          !email ||
          !newPassword ||
          !confirmPassword
        ) {
          showForgotMessage(
            "Vui lòng nhập đầy đủ thông tin!",
            "error"
          );

          return;
        }


        /*
          Kiểm tra email có đúng tài khoản không.
        */

        if (email !== savedEmail) {
          showForgotMessage(
            "Email không đúng với tài khoản hiện tại!",
            "error"
          );

          forgotEmailInput.focus();

          return;
        }


        /*
          Mật khẩu phải có ít nhất 6 ký tự.
        */

        if (newPassword.length < 6) {
          showForgotMessage(
            "Mật khẩu mới phải có ít nhất 6 ký tự!",
            "error"
          );

          forgotNewPasswordInput.focus();

          return;
        }


        /*
          Kiểm tra hai mật khẩu có giống nhau.
        */

        if (newPassword !== confirmPassword) {
          showForgotMessage(
            "Xác nhận mật khẩu mới không trùng khớp!",
            "error"
          );

          forgotConfirmPasswordInput.focus();

          return;
        }


        /*
          Lưu mật khẩu mới vào LocalStorage.
        */

        forgotSubmitBtn.disabled = true;
        forgotSubmitBtn.textContent = "Đang cập nhật...";

        localStorage.setItem(
          "accountPassword",
          newPassword
        );


        /*
          Xóa phiên đăng nhập cũ để bảo đảm
          người dùng đăng nhập lại bằng mật khẩu mới.
        */

        localStorage.removeItem("isLogin");


        showForgotMessage(
          "Đổi mật khẩu thành công! Hãy đăng nhập bằng mật khẩu mới.",
          "success"
        );


        /*
          Tự điền email vào form đăng nhập.
        */

        emailInput.value = email;
        passwordInput.value = "";


        setTimeout(function () {
          forgotSubmitBtn.disabled = false;
          forgotSubmitBtn.textContent =
            "Cập nhật mật khẩu";

          closeForgotModal();

          passwordInput.focus();

          alert(
            "Đổi mật khẩu thành công! Hãy đăng nhập bằng mật khẩu mới."
          );
        }, 1000);
      }
    );


    /* =========================
       ẨN LỖI KHI NHẬP LẠI
    ========================== */

    emailInput.addEventListener(
      "input",
      function () {
        loginError.style.display = "none";
      }
    );

    passwordInput.addEventListener(
      "input",
      function () {
        loginError.style.display = "none";
      }
    );
  </script>

</body>
</html>
